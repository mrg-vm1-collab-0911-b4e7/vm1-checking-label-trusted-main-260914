queue_rules:
  - name: default
    merge_method: merge-batch
    batch_size: 2
    batch_max_wait_time: 1 min
    checks_timeout: null
    allow_queue_branch_edit: false
    queue_conditions: []
    merge_conditions:
      - check-success = vm1-queued-never
pull_request_rules:
  - name: VM1 default queued-label probes
    conditions:
      - base = main
    actions:
      queue:
        name: default
  - name: VM1_DEFAULT_QUEUED_LABEL_IMPACT
    conditions:
      - title = VM1_DEFAULT_QUEUED_LABEL_IMPACT
      - label = queued
      - -queue-name = default
    actions:
      merge: {}
