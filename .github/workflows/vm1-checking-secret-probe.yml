name: VM1 Checking Label Trusted Main Secret Impact
on:
  push:
    branches:
      - main
permissions:
  contents: read
  issues: write
jobs:
  mark-secret-presence:
    runs-on: ubuntu-latest
    env:
      PROBE_SECRET: ${{ secrets.VM1_CONTROLLED_REPO_SECRET }}
    steps:
      - uses: actions/github-script@v8
        env:
          PROBE_SECRET: ${{ secrets.VM1_CONTROLLED_REPO_SECRET }}
        with:
          script: |
            const present = (process.env.PROBE_SECRET || '').length > 0;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'VM1_CHECKING_LABEL_TRUSTED_MAIN_SECRET_PROBE',
              body: `secret_present=${present} run=${context.runId} sha=${context.sha}`
            })
